name: app-atendimentos

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_atendimentos
      POSTGRES_USER: coti
      POSTGRES_PASSWORD: coti
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rede-atendimentos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U coti -d app_atendimentos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cotiinformatica.com.br
      PGADMIN_DEFAULT_PASSWORD: coti
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5052:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rede-atendimentos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  pgadmin_data:

networks:
  rede-atendimentos:
    driver: bridge